name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия X.Y.Z (пусто - следующий patch)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python tools/version.py
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python tools/build.py --version "$VERSION"
      - name: Check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python tools/test.py --lua lua5.1 --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: Barnacle-RU-${{ steps.version.outputs.version }}
          path: |
            dist/Barnacle-RU-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "dist/Barnacle-RU-$VERSION.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file dist/RELEASE.md
